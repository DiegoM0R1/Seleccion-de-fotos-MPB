<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Fotógrafo - Selección de Fotos</title>
  <link rel="stylesheet" href="admin-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <!-- Barra Superior del Administrador -->
  <header class="admin-header">
    <div class="header-left">
      <a href="index.html" class="back-link">‹ Vista Revisor</a>
      
      <!-- DESPLEGABLE DE EVENTOS -->
      <div class="event-select-wrapper">
        <select id="admin-event-select" class="event-select-dropdown">
          <option value="">Cargando eventos...</option>
        </select>
      </div>

      <span id="realtime-badge" class="status-badge connecting">Conectando...</span>
    </div>

    <div class="header-actions">
      <button id="copy-link-btn" class="btn btn-outline" title="Copiar enlace directo para el Revisor/Alcalde">
        🔗 Copiar Link Alcalde
      </button>
      <button id="open-create-modal-btn" class="btn btn-primary">+ Nuevo Evento</button>
      <button id="download-selected-btn" class="btn btn-secondary">
        📥 Descargar Seleccionadas (<span id="btn-selected-count">0</span>)
      </button>
      <button id="finalize-event-btn" class="btn btn-danger">🗑️ Finalizar Evento</button>
    </div>
  </header>

  <!-- Tarjetas de Métricas -->
  <section class="metrics-container">
    <div class="metric-card">
      <span class="metric-value" id="metric-total">0</span>
      <span class="metric-label">Fotos Totales</span>
    </div>
    <div class="metric-card highlight-card">
      <span class="metric-value" id="metric-selected">0</span>
      <span class="metric-label">Seleccionadas por el Alcalde</span>
    </div>
    <div class="metric-card">
      <span class="metric-value" id="metric-published">0</span>
      <span class="metric-label">Publicadas</span>
    </div>
  </section>

  <!-- Barra de Filtros -->
  <nav class="filter-bar">
    <button class="filter-tab active" data-filter="all">Todas (<span id="filter-count-all">0</span>)</button>
    <button class="filter-tab" data-filter="selected">✓ Seleccionadas (<span id="filter-count-selected">0</span>)</button>
    <button class="filter-tab" data-filter="unselected">□ Pendientes (<span id="filter-count-unselected">0</span>)</button>
    <button class="filter-tab" data-filter="published">📢 Publicadas (<span id="filter-count-published">0</span>)</button>
  </nav>

  <!-- Galería del Administrador -->
  <main class="gallery-container">
    <div id="admin-gallery-grid" class="gallery-grid"></div>
  </main>

  <!-- Modal para Crear Nuevo Evento -->
  <div id="create-event-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Crear Nuevo Evento</h2>
      
      <div class="form-group">
        <label for="new-event-name">Nombre del Evento:</label>
        <input type="text" id="new-event-name" placeholder="Ej: Inauguración de Carretera" class="form-control">
      </div>

      <div class="form-group">
        <label for="event-photos-input">Seleccionar Fotografías (JPG/PNG):</label>
        <input type="file" id="event-photos-input" multiple accept="image/*" class="form-control">
      </div>

      <!-- Indicador de Progreso -->
      <div id="upload-progress-container" class="progress-container hidden">
        <p id="upload-status-text">Procesando fotos...</p>
        <div class="progress-bar-bg">
          <div id="upload-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button id="start-upload-btn" class="btn btn-success">Crear y Subir Fotos</button>
        <button id="close-create-modal-btn" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Confirmación para Finalizar Evento -->
  <div id="finalize-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>¿Finalizar Evento?</h2>
      <p style="margin: 12px 0; color: #64748b;">Esta acción cambiará el estado del evento. Puedes optar por archivar el registro o eliminarlo por completo.</p>
      
      <div class="modal-actions" style="flex-direction: column; gap: 8px;">
        <button id="confirm-archive-btn" class="btn btn-secondary" style="width: 100%;">Solo Archivar Evento</button>
        <button id="confirm-delete-btn" class="btn btn-danger" style="width: 100%;">Eliminar Todo (Base de Datos y Fotos)</button>
        <button id="cancel-finalize-btn" class="btn btn-ghost" style="width: 100%;">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
